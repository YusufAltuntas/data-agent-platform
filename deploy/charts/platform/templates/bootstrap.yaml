{{- $ctx := dict "root" . "name" "bootstrap" }}
# Bootstrap Job (design §10, step 5): migrations, datasets, seed and LiteLLM team keys, run
# before every install and upgrade. Its ConfigMap and ServiceAccount are hook resources with a
# lower weight, so they exist before the Job. If the Job fails, the release stops and the old
# pods keep running. `before-hook-creation` (not `hook-succeeded`) keeps a failed Job for
# debugging and lets the next upgrade replace it (M5 spike).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-bootstrap
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-bootstrap-config
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- include "platform.config" . | nindent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-bootstrap
  labels:
    {{- include "platform.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "platform.labels" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: platform-bootstrap
      automountServiceAccountToken: false
      securityContext:
        {{- include "platform.podSecurityContext" . | nindent 8 }}
      # The infra chart is installed first, but wait for the two services bootstrap talks to.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.waitImage }}
          command: [sh, -c, "until pg_isready -q -h postgres -p 5432 -U postgres; do sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            {{- include "platform.containerSecurityContext" . | nindent 12 }}
        - name: wait-for-litellm
          image: {{ .Values.waitImage }}
          command:
            - sh
            - -c
            - until wget -q -O /dev/null {{ .Values.litellm.url }}/health/readiness; do sleep 2; done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            {{- include "platform.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: bootstrap
          image: {{ include "platform.image" . }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, dap.db.bootstrap]
          envFrom:
            - configMapRef:
                name: platform-bootstrap-config
          env:
            {{- include "platform.secretEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          securityContext:
            {{- include "platform.containerSecurityContext" . | nindent 12 }}
