# Serves the built SPA. The API is routed by Traefik under /api on the same origin (K16), not here.
# Writable paths (read-only root filesystem): /tmp (pid, temp dirs) and
# /usr/share/nginx/runtime (config.js, written by entrypoint.sh).
worker_processes 1;  # a static SPA; "auto" would start one per host CPU
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    server {
        listen 8080;
        root /usr/share/nginx/app;

        # Probe path.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Runtime settings, generated at container start; never cached.
        location = /config.js {
            alias /usr/share/nginx/runtime/config.js;
            add_header Cache-Control "no-store";
        }

        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # Vite's content-hashed bundles.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA fallback: client-side routes (/callback, /teams/..., /runs/...) load index.html.
        location / {
            try_files $uri /index.html;
        }
    }
}
