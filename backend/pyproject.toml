[project]
name = "dap"
version = "0.1.0"
description = "Multi-team data analyst agent platform"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.7.0",
    "cryptography>=50.0.2",
    "faker>=40.54.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "kombu>=5.7.0",
    "langfuse>=4.7,<5",
    "openai>=2,<3",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "sqlglot>=30.33.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
    "testcontainers[postgres,redis]>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["dap", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests"]
markers = [
    "integration: tests that need real Postgres, Redis and RabbitMQ containers",
]
