# CI (design §12). Every check is a `make` target, so anything CI runs can be run locally.
# Only tool setup and the e2e failure diagnostics are plain `run:` steps.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Tool versions match the local environment (Helm 4, kind 0.33 with Kubernetes 1.37).
  UV_VERSION: "0.13.9"
  NODE_VERSION: "24.15.0"
  HELM_VERSION: "v4.3.2"
  KUBECONFORM_VERSION: "v0.8.0"
  KIND_VERSION: "v0.33.0"
  KUBECTL_VERSION: "v1.37.2"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # `uv run` fails instead of silently re-resolving when uv.lock is out of date.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v5
      # Python 3.13 comes from backend/.python-version; `uv run` downloads it.
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      # Integration tests use testcontainers on the runner's Docker.
      - run: make lint test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - run: make frontend-check

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make helm-lint

  e2e-kind:
    needs: [python, frontend, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Docker publishes the kind port mapping as root, so port 80 needs no privileges here.
      PUBLIC_PORT: "80"
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kind and kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$RUNNER_TEMP/bin/kind" "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # No .env in CI: with CI=true scripts/secrets.sh generates random secrets, and the
      # cluster runs the fake model (K22).
      - run: CI=true make up
      - run: make smoke
      - name: Cluster diagnostics
        if: failure()
        run: |
          kc() { kubectl --context kind-dap "$@"; }
          kc get pods -A -o wide || true
          kc get events -A --sort-by=.lastTimestamp | tail -n 60 || true
          for pod in $(kc -n dap get pods -o name 2>/dev/null); do
            echo "::group::logs $pod"
            kc -n dap logs "$pod" --all-containers --tail=80 || true
            echo "::endgroup::"
          done
